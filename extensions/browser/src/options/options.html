<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Slopwash Options</title>
  <style>
    body {
      max-width: 480px;
      margin: 24px auto;
      padding: 0 16px;
      background: #0a0a0a;
      color: #d4d4d8;
      font-family: system-ui, sans-serif;
      font-size: 14px;
    }
    h1 { font-size: 20px; margin-bottom: 16px; }
    label { display: block; margin: 12px 0 4px; color: #a1a1aa; font-size: 13px; }
    select, input[type="checkbox"] { margin-top: 4px; }
    select {
      padding: 6px 8px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 4px;
      color: #d4d4d8;
    }
    .saved { color: #4ade80; font-size: 12px; margin-top: 12px; display: none; }
    button {
      margin-top: 16px;
      padding: 8px 16px;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Slopwash Options</h1>

  <label>
    Model-specific detection:
    <select id="model">
      <option value="">Any model</option>
      <option value="gpt-4o">GPT-4o</option>
      <option value="claude">Claude</option>
      <option value="gemini">Gemini</option>
      <option value="llama">Llama</option>
    </select>
  </label>

  <button id="save">Save</button>
  <p class="saved" id="saved">Settings saved.</p>

  <script src="options.js"></script>
</body>
</html>
