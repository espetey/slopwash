<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Slopwash</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      background: #0a0a0a;
      color: #d4d4d8;
      font-family: system-ui, sans-serif;
      font-size: 13px;
    }
    h1 { font-size: 16px; margin: 0 0 8px; color: #e4e4e7; }
    .score { font-size: 36px; font-weight: bold; text-align: center; margin: 16px 0; }
    .score.good { color: #4ade80; }
    .score.ok { color: #facc15; }
    .score.bad { color: #f87171; }
    .info { color: #71717a; font-size: 11px; text-align: center; }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 12px;
      background: #0d9488;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #14b8a6; }
    textarea {
      width: 100%;
      height: 100px;
      margin-top: 8px;
      padding: 8px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      color: #d4d4d8;
      font-size: 12px;
      resize: vertical;
    }
    .placeholder {
      color: #52525b;
      text-align: center;
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <h1>Slopwash</h1>
  <p>Paste text or select text on the page and click "Scan".</p>
  <textarea id="input" placeholder="Paste text to scan..."></textarea>
  <button id="scan">Scan for slop</button>
  <div id="result" class="placeholder">No scan yet</div>
  <p class="info">v0.1.0 — slopwash.com</p>
  <script src="popup.js"></script>
</body>
</html>
